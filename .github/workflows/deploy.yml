name: Build and typecheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edueats-v2/package-lock.json

      - name: Install dependencies
        working-directory: edueats-v2
        run: npm ci

      - name: Typecheck (shared, api)
        working-directory: edueats-v2
        run: |
          npx tsc -p packages/shared --noEmit
          npx tsc -p apps/api --noEmit

      - name: Build (shared, api, web)
        working-directory: edueats-v2
        run: npm run build

      - name: Verify artifacts
        working-directory: edueats-v2
        run: |
          test -f apps/api/dist/server.js || (echo "API server.js not built" && exit 1)
          test -f apps/api/dist/web/index.html || (echo "Web dist not synced to api/dist/web" && exit 1)
          echo "Build artifacts OK"
