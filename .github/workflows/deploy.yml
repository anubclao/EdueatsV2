name: Deploy EduEats v2

on:
  push:
    branches:
      - main
    paths:
      - 'edueats-v2/**'

jobs:
  deploy:
    name: Build & Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edueats-v2/package-lock.json

      - name: Install dependencies
        working-directory: edueats-v2
        run: npm ci

      - name: Build shared
        working-directory: edueats-v2
        run: npm run build -w @edueats/shared

      - name: Build API
        working-directory: edueats-v2
        run: npm run build -w @edueats/api

      - name: Build Web
        working-directory: edueats-v2
        run: npm run build -w @edueats/web

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest code
            git pull origin main

            # Install prod dependencies only
            cd edueats-v2
            npm ci --omit=dev

            # Build everything on server
            npm run build -w @edueats/shared
            npm run build -w @edueats/api
            npm run build -w @edueats/web

            # Restart app (PM2)
            pm2 reload edueats-v2 --update-env || \
              pm2 start apps/api/dist/server.js \
                --name edueats-v2 \
                --env production \
                --update-env
            pm2 save
