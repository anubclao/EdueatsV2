name: Deploy EduEats v2

on:
  push:
    branches:
      - main
    paths:
      - 'edueats-v2/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Build and Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edueats-v2/package-lock.json

      - name: Install dependencies
        working-directory: edueats-v2
        run: npm ci

      - name: Build monorepo
        working-directory: edueats-v2
        run: npm run build

      - name: Deploy via SSH and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            git fetch origin main
            git reset --hard origin/main

            cd edueats-v2
            npm ci
            npm run build

            pm2 reload edueats-v2 --update-env || \
              pm2 start apps/api/dist/server.js \
                --name edueats-v2 \
                --env production \
                --update-env
            pm2 save
